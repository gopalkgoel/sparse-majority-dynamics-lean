name = "majorityDynamics"
version = "0.1.0"
defaultTargets = ["MajorityDynamics", "AxiomCheck", "PaperScaffold", "PaperAxiomAudit", "UniformProofChecks"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "MajorityDynamics"

[[lean_lib]]
name = "AxiomCheck"

[[lean_lib]]
name = "PaperScaffold"

[[lean_lib]]
name = "PaperAxiomAudit"

# Independent literature scaffold/audit; strict completion is a separate file.
[[lean_lib]]
name = "LiteratureGoals"

[[lean_lib]]
name = "UniformProofChecks"

[[lean_lib]]
name = "UniformCompletion"

[[lean_lib]]
name = "SparseEvolutionChecks"

[[lean_lib]]
name = "SparseTerminalChecks"

[[lean_lib]]
name = "SparseTerminalBudgetChecks"

[[lean_lib]]
name = "SparseStoppedChecks"
